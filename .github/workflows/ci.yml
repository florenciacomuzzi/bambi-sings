name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Flake8
        run: flake8 bambi_sings tests

      - name: Pytest
        run: pytest --cov=bambi_sings --cov-report=term-missing --cov-fail-under=85
